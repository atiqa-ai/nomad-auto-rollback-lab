name: Nomad Lab CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r app/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  publish:
    name: Docker Build and GHCR Publish
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit-tagged Docker image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/atiqa-ai/nomad-auto-rollback-lab:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/atiqa-ai/nomad-auto-rollback-lab
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Show immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/atiqa-ai/nomad-auto-rollback-lab@${IMAGE_DIGEST}"

  deploy:
    name: Deploy to Isolated Nomad VM
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LAB_CD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: nomad-lab
    concurrency:
      group: nomad-sandbox-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Connect to VM tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ vars.LAB_TAILSCALE_IP }}
      - name: Configure SSH key and pinned host key
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.LAB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.LAB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/id_ed25519"
          test -s "$HOME/.ssh/known_hosts"
      - name: Deploy exact published Docker digest to Nomad
        shell: bash
        env:
          LAB_TAILSCALE_IP: ${{ vars.LAB_TAILSCALE_IP }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$LAB_TAILSCALE_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "manoo@${LAB_TAILSCALE_IP}" \
            "/home/manoo/bin/nomad-lab-deploy '${COMMIT_SHA}' '${IMAGE_DIGEST}'"
